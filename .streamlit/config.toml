[theme]
primaryColor = "#1A5276"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1C2833"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5
maxMessageSize = 200
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[runner]
fastReruns = true
